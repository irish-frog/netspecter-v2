name: Passive TLS inspector
on:
  push:
    branches: [main, feature/passive-attribution-rebuild]
    paths: ['inspector/**', 'systemd/netspecter-tls-inspector.service', '.github/workflows/tls-inspector.yml']
  pull_request:
    paths: ['inspector/**', 'systemd/netspecter-tls-inspector.service', '.github/workflows/tls-inspector.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting, tests and lint
        working-directory: inspector
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Linux release binary
        working-directory: inspector
        run: |
          cargo build --locked --release
          ./target/release/netspecter-tls-inspector --version
          cd target/release
          sha256sum netspecter-tls-inspector > netspecter-tls-inspector.sha256
      - name: Isolated capture and IPC smoke test
        run: sudo python3 inspector/tests/linux_capture.py inspector/target/release/netspecter-tls-inspector
      - name: Linux build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tls-inspector-linux-x86_64
          path: |
            inspector/target/release/netspecter-tls-inspector
            inspector/target/release/netspecter-tls-inspector.sha256
          retention-days: 7
          if-no-files-found: error
